spring.application.name=philosopher-service
# Le philosophe j écoute sur le port (philosophers.base-port + j), ex : 9000, 9001, ...
# Lancer le philosophe j avec : --server.port=900j --philosopher.id=j --philosophers.total=N
philosophers.base-port=9000
server.port=9000
# distributed (3.3, par défaut), supervisor (3.2) ou zookeeper (3.4)
philosopher.mode=distributed
# Pour le mode zookeeper, démarrer ZooKeeper puis chaque philosophe avec un id différent.
zookeeper.connect-string=localhost:2181
zookeeper.acquire-timeout-ms=5000
