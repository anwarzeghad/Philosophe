spring.application.name=philosopher-service
# Le philosophe j écoute sur le port (philosophers.base-port + j), ex : 9000, 9001, ...
# Lancer le philosophe j avec : --server.port=900j --philosopher.id=j --philosophers.total=N
philosophers.base-port=9000
server.port=9000
# distributed (3.3, par défaut), supervisor (3.2) ou zookeeper (3.4)
philosopher.mode=distributed
# Pour le mode zookeeper, démarrer ZooKeeper puis chaque philosophe avec un id différent.
zookeeper.connect-string=localhost:2181
zookeeper.acquire-timeout-ms=5000

# --- Partie 6 : transport des événements vers le moniteur ---
# http (par défaut, POST /events) ou kafka (topic ci-dessous, consommé par le moniteur)
monitor.transport=http
monitor.url=http://localhost:8080
monitor.topic=philosophers-events
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=5
spring.kafka.producer.properties.spring.json.add.type.headers=false
# Si Kafka est arrêté, un envoi n'attend pas plus de 2 s : le philosophe n'est pas bloqué
spring.kafka.producer.properties.max.block.ms=2000
# Kafka exige delivery.timeout.ms >= request.timeout.ms + linger.ms, sinon le producteur ne se construit pas
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000

# --- Supervision (Actuator + Prometheus) ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
