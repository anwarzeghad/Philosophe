# Supervision : Prometheus collecte /actuator/prometheus de chaque microservice (toutes les 10 s).
global:
  scrape_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: monitor
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["monitor:8080"]

  - job_name: philosophers
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - philosopher-0:8080
          - philosopher-1:8080
          - philosopher-2:8080
          - philosopher-3:8080
          - philosopher-4:8080
