# Règles d'alerte : détection des pannes et de la famine.
groups:
  - name: philosophes
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} ne répond plus"

      - alert: PasDeRepas
        # aucun événement EATING reçu par le moniteur depuis 2 minutes : interblocage, panne Kafka ou ZooKeeper
        expr: sum(increase(philosophers_events_total{state="EATING"}[2m])) == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Aucun philosophe n'a mangé depuis 2 minutes"
