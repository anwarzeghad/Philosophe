# Chaîne CI/CD : construire, tester, conteneuriser, vérifier sur Kubernetes, déployer.
#
#   test       : mvn verify de chaque microservice (JUnit, Mockito, Spring Boot, Kafka embarqué)
#   docker     : construit les images ; sur main, les publie sur ghcr.io (tags : sha du commit + latest)
#   e2e-kind   : déploie tout k8s/ dans un cluster Kubernetes jetable (kind) et vérifie que les
#                philosophes mangent (le moniteur reçoit des événements par Kafka)
#   deploy     : sur main uniquement, si le secret KUBE_CONFIG existe : met à jour le cluster
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [monitor-service, supervisor-service, philosopher-service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build et tests
        run: mvn -B verify
      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports
          if-no-files-found: ignore

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [monitor-service, supervisor-service, philosopher-service]
    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Connexion à ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construction (et publication sur main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: |
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  e2e-kind:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Construction des images locales
        run: |
          docker build -t philosophers/monitor-service:latest monitor-service
          docker build -t philosophers/philosopher-service:latest philosopher-service
      - name: Cluster Kubernetes jetable (kind)
        uses: helm/kind-action@v1
        with:
          cluster_name: philosophers
      - name: Chargement des images dans le cluster
        run: |
          kind load docker-image philosophers/monitor-service:latest --name philosophers
          kind load docker-image philosophers/philosopher-service:latest --name philosophers
      - name: Déploiement
        run: |
          kubectl apply -k k8s
          kubectl -n philosophers rollout status statefulset/kafka --timeout=300s
          kubectl -n philosophers rollout status deployment/zookeeper --timeout=180s
          kubectl -n philosophers rollout status deployment/monitor --timeout=300s
          kubectl -n philosophers rollout status statefulset/philosopher --timeout=300s
      - name: Les philosophes mangent (événements reçus par Kafka)
        run: |
          kubectl -n philosophers port-forward svc/monitor 8080:8080 &
          sleep 5
          for i in $(seq 1 40); do
            EATING=$(curl -s localhost:8080/events/state | grep -o '"state":"EATING"' | wc -l || true)
            ALL=$(curl -s localhost:8080/events/state | grep -o '"philosopherId"' | wc -l || true)
            echo "tentative $i : $ALL philosophes connus, $EATING en train de manger"
            if [ "$ALL" -ge 5 ]; then exit 0; fi
            sleep 5
          done
          echo "Les 5 philosophes n'ont pas tous émis d'événements" >&2
          exit 1
      - name: "Panne d'un philosophe : le pod est recréé et le système continue"
        run: |
          kubectl -n philosophers delete pod philosopher-2 --wait=false
          sleep 5
          kubectl -n philosophers rollout status statefulset/philosopher --timeout=300s
      - name: Diagnostic en cas d'échec
        if: failure()
        run: |
          kubectl -n philosophers get pods -o wide
          kubectl -n philosophers describe pods | tail -n 120
          kubectl -n philosophers logs statefulset/philosopher --all-containers --tail=60 || true
          kubectl -n philosophers logs deployment/monitor --tail=60 || true

  deploy:
    needs: [docker, e2e-kind]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
    steps:
      - uses: actions/checkout@v4
      - name: Cluster non configuré
        if: env.KUBE_CONFIG == ''
        run: echo "Secret KUBE_CONFIG absent, deploiement ignore (les images sont publiees sur ghcr.io)."
      - uses: azure/setup-kubectl@v4
        if: env.KUBE_CONFIG != ''
      - name: Déploiement sur le cluster
        if: env.KUBE_CONFIG != ''
        run: |
          mkdir -p ~/.kube
          echo "$KUBE_CONFIG" > ~/.kube/config
          chmod 600 ~/.kube/config
          IMAGE=ghcr.io/${{ github.repository }}
          cd k8s
          kubectl kustomize . | \
            sed "s#philosophers/monitor-service:latest#$IMAGE/monitor-service:${{ github.sha }}#; s#philosophers/philosopher-service:latest#$IMAGE/philosopher-service:${{ github.sha }}#" | \
            kubectl apply -f -
          kubectl -n philosophers rollout status deployment/monitor --timeout=300s
          kubectl -n philosophers rollout status statefulset/philosopher --timeout=300s
