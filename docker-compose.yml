# Pile complète du dîner des philosophes (partie 6).
#
#   docker compose up --build -d        démarrer (ZooKeeper, Kafka, moniteur, 5 philosophes, Prometheus)
#   docker compose ps                   état des conteneurs
#   docker compose logs -f monitor      journaux du moniteur
#   curl localhost:8080/events/state    état courant de chaque philosophe (aussi : http://localhost:8080)
#   curl localhost:9090                 Prometheus (métrique philosophers_events_total)
#   docker compose down                 tout arrêter
#
# Test de panne : docker compose stop philosopher-3  (les autres continuent, voir "restart")
#                 docker compose stop monitor        (les événements restent dans Kafka)
#                 docker compose start monitor       (le moniteur rattrape les événements)
#
# Les philosophes utilisent ici le verrou distribué ZooKeeper (partie 3.4), qui supporte le
# redémarrage d'un conteneur (verrou libéré à l'expiration de session). Le protocole à jetons
# (3.3) garde l'état des jetons en mémoire : il convient aux processus, pas aux redémarrages.

x-philosopher: &philosopher
  build: ./philosopher-service
  restart: unless-stopped
  depends_on:
    kafka:
      condition: service_healthy
    zookeeper:
      condition: service_started
  environment: &philosopher-env
    SERVER_PORT: "8080"
    PHILOSOPHER_MODE: zookeeper
    PHILOSOPHERS_TOTAL: "5"
    ZOOKEEPER_CONNECT_STRING: zookeeper:2181
    MONITOR_TRANSPORT: kafka
    SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    # adresse des autres philosophes (graphe Master-Worker de la partie 5)
    PHILOSOPHERS_PEER_URL_TEMPLATE: http://philosopher-{id}:8080
    # journaux JSON : exploitables par un collecteur (Loki, ELK...)
    LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash

services:
  zookeeper:
    image: zookeeper:3.9.4
    container_name: philosophes-zookeeper
    ports:
      - "2181:2181"
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.9.0
    container_name: philosophes-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  monitor:
    build: ./monitor-service
    container_name: philosophes-monitor
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      MONITOR_KAFKA_ENABLED: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LOGGING_STRUCTURED_FORMAT_CONSOLE: logstash

  philosopher-0:
    <<: *philosopher
    container_name: philosophes-0
    ports:
      - "9000:8080"   # accès direct (ex. maître du graphe : localhost:9000/graph/compute)
    environment:
      <<: *philosopher-env
      PHILOSOPHER_ID: "0"
  philosopher-1:
    <<: *philosopher
    container_name: philosophes-1
    environment:
      <<: *philosopher-env
      PHILOSOPHER_ID: "1"
  philosopher-2:
    <<: *philosopher
    container_name: philosophes-2
    environment:
      <<: *philosopher-env
      PHILOSOPHER_ID: "2"
  philosopher-3:
    <<: *philosopher
    container_name: philosophes-3
    environment:
      <<: *philosopher-env
      PHILOSOPHER_ID: "3"
  philosopher-4:
    <<: *philosopher
    container_name: philosophes-4
    environment:
      <<: *philosopher-env
      PHILOSOPHER_ID: "4"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: philosophes-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    depends_on:
      - monitor
