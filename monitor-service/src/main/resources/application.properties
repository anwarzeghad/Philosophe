spring.application.name=monitor-service
server.port=8080

# --- Partie 6 : réception des événements par Kafka ---
# true : le moniteur consomme aussi le topic Kafka (en plus de POST /events)
monitor.kafka.enabled=false
monitor.topic=philosophers-events
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=monitor
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Un message illisible est ignoré (et journalisé) au lieu de bloquer le consommateur
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.philosophers.monitor_service.dto.EventDto
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=com.philosophers.*

# --- Supervision (Actuator + Prometheus) ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
