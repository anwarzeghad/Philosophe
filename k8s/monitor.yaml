# Moniteur : consomme les événements Kafka et affiche le tableau de bord.
# Une seule réplique : l'historique est gardé en mémoire (au redémarrage, Kafka rejoue les
# événements non encore lus grâce au groupe de consommateurs "monitor").
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor
  labels: {app: monitor}
spec:
  replicas: 1
  selector:
    matchLabels: {app: monitor}
  template:
    metadata:
      labels: {app: monitor}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: monitor
          image: philosophers/monitor-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8080}
          envFrom:
            - configMapRef: {name: philosophers-config}
          env:
            - {name: MONITOR_KAFKA_ENABLED, value: "true"}
          # démarrage lent de la JVM : le startupProbe évite que la liveness tue le pod trop tôt
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: monitor
spec:
  selector: {app: monitor}
  ports:
    - name: http
      port: 8080
      targetPort: http
